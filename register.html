<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account — Percaal</title>
    <meta
      name="description"
      content="Create a Percaal account for faster checkout, order history and offers tailored to you."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="register" data-path="/register" class="antialiased bg-white is-loading">
    <script>
      /* First visit only: the loader curtain (styles.css "LOADER + ARRIVAL").
         It is added here, before anything paints, instead of being written
         into the page, so every visitor and every crawler gets the same
         content. Crawlers, automated browsers and visitors who prefer
         reduced motion never see it; nor does anyone on a later visit. */
      (function () {
        if (navigator.webdriver || /bot|crawl|spider|slurp|preview|inspectiontool|facebookexternalhit/i.test(navigator.userAgent)) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        try {
          if (localStorage.getItem("percaal-visited")) return;
          localStorage.setItem("percaal-visited", "1");
        } catch (e) {
          return;
        }
        document.body.classList.add("has-loader");
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<div class="loader" data-loader aria-hidden="true"><div class="loader__inner">' +
            '<img class="loader__logo" src="images/percaal-landscape-logo.svg" alt="" width="168" height="38" />' +
            '<span class="loader__line"></span></div></div>'
        );
      })();
    </script>
    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ============ CREATE ACCOUNT (Figma 154:5122) ============
           One centred card. The account is still verified by SMS, so
           submitting swaps the form for the six-digit code step that
           initOtpAuth() drives — the same flow login used to open with,
           now sitting behind registration where the design puts it. -->
      <section class="auth">
        <div class="authcard authcard--wide">
          <div class="authcard__head">
            <h1 class="authcard__title authcard__title--center">Create Account</h1>
            <p class="authcard__blurb authcard__blurb--center">
              We'll send you a verification code via SMS.
            </p>
          </div>

          <div data-otp-flow data-otp-redirect="my-account.html">
            <!-- Step 1: the details -->
            <div data-otp-step="phone" class="authcard__stack">
              <div class="authcard__fields">
              <div class="grid grid-cols-2 gap-2">
                <div class="field field--small">
                  <label class="field__label" for="reg-first">First Name</label>
                  <input class="field__input" type="text" id="reg-first" name="first-name" autocomplete="given-name" required />
                </div>
                <div class="field field--small">
                  <label class="field__label" for="reg-last">Last Name</label>
                  <input class="field__input" type="text" id="reg-last" name="last-name" autocomplete="family-name" required />
                </div>
              </div>

              <div class="field field--small">
                <label class="field__label" for="reg-phone">Enter Phone Number</label>
                <div class="field__input field__input--phone-combined">
                  <button type="button" class="field__ccode" aria-label="Choose country">
                    <img src="images/flag-eg.webp" alt="" width="16" height="16" />
                    <span>EGY (+20)</span>
                    <span class="ico ico-16" data-ico="arrow-down-01-sharp"></span>
                  </button>
                  <span class="field__divider" aria-hidden="true"></span>
                  <input
                    class="field__phone-input"
                    type="tel"
                    id="reg-phone"
                    name="phone"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="01001234567"
                    data-otp-phone
                  />
                </div>
              </div>

              <div class="field field--small">
                <label class="field__label" for="reg-email">Enter Email Address</label>
                <input class="field__input" type="email" id="reg-email" name="email" autocomplete="email" required />
              </div>

              <div class="field field--small">
                <label class="field__label" for="reg-password">Enter Password</label>
                <div class="field__pw">
                  <input class="field__input" type="password" id="reg-password" name="password" autocomplete="new-password" required />
                  <button type="button" class="field__eye" data-pw-toggle aria-label="Show password" aria-pressed="false">
                    <span class="ico" data-ico="eye"></span>
                  </button>
                </div>
              </div>

              <div class="field field--small">
                <label class="field__label" for="reg-confirm">Confirm Password</label>
                <div class="field__pw">
                  <input class="field__input" type="password" id="reg-confirm" name="confirm-password" autocomplete="new-password" required />
                  <button type="button" class="field__eye" data-pw-toggle aria-label="Show password" aria-pressed="false">
                    <span class="ico" data-ico="eye"></span>
                  </button>
                </div>
              </div>

              <ul class="pwrules" data-pw-rules data-pw-for="#reg-password" data-pw-confirm="#reg-confirm">
                <li class="pwrule" data-pw-rule="special">
                  <span class="ico" data-ico="checkmark-circle-04"></span>
                  <span>Password must contains special characters @&amp;$#*!</span>
                </li>
                <li class="pwrule" data-pw-rule="uppercase">
                  <span class="ico" data-ico="checkmark-circle-04"></span>
                  <span>Password must contains uppercase letters</span>
                </li>
                <li class="pwrule" data-pw-rule="match">
                  <span class="ico" data-ico="checkmark-circle-04"></span>
                  <span>Password must match</span>
                </li>
              </ul>

              <p class="text-xs text-error" data-otp-error hidden></p>
              </div>

              <button type="button" data-otp-send class="cta cta--brown cta--sentence w-full">Create Account</button>

              <p class="authcard__foot">
                Already have an account? <a href="login.html" class="auth-link">Login</a>
              </p>
            </div>

            <!-- Step 2: the code -->
            <div data-otp-step="code" hidden class="authcard__fields">
              <p class="authcard__blurb authcard__blurb--center">
                Enter the code we sent to <span data-otp-target></span>
              </p>
              <div class="otp-boxes">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" data-otp-box class="otp-box" />
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" data-otp-box class="otp-box" />
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" data-otp-box class="otp-box" />
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" data-otp-box class="otp-box" />
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" data-otp-box class="otp-box" />
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" data-otp-box class="otp-box" />
              </div>
              <button type="button" data-otp-verify class="cta cta--brown cta--sentence w-full">Verify</button>
              <p class="authcard__foot">
                <button type="button" data-otp-back class="auth-link">Change number</button>
                <span class="px-2" aria-hidden="true">·</span>
                <button type="button" data-otp-resend class="auth-link">Resend code</button>
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        /* Inline every icon declared with data-ico */
        var ic = window.icon || function () { return ''; };
        document.querySelectorAll('[data-ico]').forEach(function (el) {
          el.innerHTML = ic(el.getAttribute('data-ico'));
        });
      })();
    </script>
  </body>
</html>
