<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Wallet — Percaal</title>
    <meta name="description" content="Check your wallet balance, top up and review your transaction history at Percaal." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="account" data-path="/my-account/wallet" class="antialiased bg-white is-loading">
    <!-- Loader curtain. First child of <body> on every page so it paints
         with the first frame; initLoader() in scripts.js lifts it once fonts
         and the fold are ready. See styles.css "LOADER + ARRIVAL". -->
    <div class="loader" data-loader aria-hidden="true">
      <div class="loader__inner">
        <img class="loader__logo" src="images/percaal-landscape-logo.svg" alt="" width="168" height="38" />
        <span class="loader__line"></span>
      </div>
    </div>

    <!-- Shared header is injected here by scripts.js -->
    <div id="site-header"></div>

    <main class="overflow-x-clip acct-page">
      <!-- Account layout: two-column grid (sidebar collapses above content on mobile) -->
      <div class="flex lg:flex-row flex-col items-start gap-7 md:gap-8 container-design py-10 md:py-20">
        <!-- ============================ ACCOUNT SIDEBAR ============================ -->
        <!-- ============================ MOBILE ACCOUNT NAV (pills) ============================ -->
        <!-- Shared account rail (Figma 159:8116), injected by
             accountMenuHTML() in scripts.js so every account page
             shows the same menu. -->
        <div id="account-menu" data-active="wallet" class="w-full lg:w-[384px] shrink-0"></div>

        <!-- ============================ ACCOUNT CONTENT ============================ -->
        <!-- Wallet panel — Figma 163:6451 (desktop) / 261:11353 (phone).
             Balance, the vouchers waiting to be applied, Add Voucher, and
             the history. The vouchers and history are drawn by initWallet()
             in scripts.js; the Add / Apply popups are below <main>. -->
        <div class="w-full min-w-0 lg:flex-1 wal" data-wallet>
          <div class="acct-head">
            <nav class="acct-crumb" aria-label="Breadcrumb">
              <a href="index.html">Home</a>
              <span class="ico" data-ico="arrow-right-01-sharp" aria-hidden="true"></span>
              <span class="acct-crumb__here" aria-current="page">My Wallet</span>
            </nav>
            <h1 class="acct-title">My Wallet</h1>
          </div>

          <button type="button" class="wal-add" data-open="voucher-add">
            <span class="ico ico-line" data-ico="plus-sign" aria-hidden="true"></span>
            Add Voucher
          </button>

          <section class="wal-balance" aria-label="Wallet balance">
            <span class="wal-balance__icon"><span class="ico ico-line" data-ico="wallet-02" aria-hidden="true"></span></span>
            <div>
              <p class="pts-card__label">Wallet Balance</p>
              <p class="pts-card__value" data-wallet-amount>EGP 2,000</p>
            </div>
          </section>

          <section class="wal-vouchers" aria-labelledby="wal-vouchers-title">
            <h2 class="wal-vouchers__title" id="wal-vouchers-title">Available Vouchers</h2>
            <ul class="wal-vouchers__list" data-wallet-vouchers></ul>
            <p class="wal-vouchers__empty" data-wallet-empty hidden>No vouchers to apply. Add one with its code.</p>
          </section>

          <section class="pts-history wal-history" aria-labelledby="wal-history-title">
            <h2 class="pts-history__title" id="wal-history-title">Wallet History</h2>
            <ul class="pts-history__list" data-wallet-history></ul>
          </section>
        </div>
      </div>
    </main>

    <!-- Shared footer is injected here by scripts.js -->
    <div id="site-footer"></div>

    <!-- Toggle the inline top-up form -->
    <!-- Add Voucher (Figma 177:5794 / 261:11951) and Apply Voucher (Figma
         177:5820 / 261:12010). .bottom-sheet: a sheet with a grab handle
         on phones, a centred 400px popup from 768px. Wired by initWallet(). -->
    <div data-modal="voucher-add" class="bottom-sheet vsheet" role="dialog" aria-modal="true" aria-labelledby="vsheet-add-title">
      <div class="vsheet__head">
        <span class="ico ico-line vsheet__ico" data-ico="invoice-01" aria-hidden="true"></span>
        <h2 class="vsheet__title" id="vsheet-add-title">Add Voucher</h2>
        <button type="button" class="vsheet__close" data-close aria-label="Close"><span class="ico ico-line" data-ico="cancel-01" aria-hidden="true"></span></button>
      </div>
      <form class="vsheet__body" data-voucher-add-form novalidate>
        <label class="vsheet__label" for="vsheet-code">Enter Voucher Code</label>
        <input class="vsheet__input" id="vsheet-code" type="text" data-voucher-code autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. TFH738990#723" />
        <p class="vsheet__error" data-voucher-error hidden>Enter the code printed on your voucher.</p>
        <button type="submit" class="vsheet__cta">Enter Voucher</button>
      </form>
    </div>

    <div data-modal="voucher-apply" class="bottom-sheet vsheet" role="dialog" aria-modal="true" aria-labelledby="vsheet-apply-title">
      <div class="vsheet__head">
        <span class="ico ico-line vsheet__ico" data-ico="invoice-01" aria-hidden="true"></span>
        <h2 class="vsheet__title" id="vsheet-apply-title">Apply Voucher</h2>
        <button type="button" class="vsheet__close" data-close aria-label="Close"><span class="ico ico-line" data-ico="cancel-01" aria-hidden="true"></span></button>
      </div>
      <div class="vsheet__body">
        <p class="vsheet__text" data-voucher-apply-text>100 EGP will be added to your wallet balance</p>
        <button type="button" class="vsheet__cta" data-voucher-apply-confirm>Apply Voucher</button>
      </div>
    </div>
  </body>
</html>
