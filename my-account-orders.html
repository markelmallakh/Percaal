<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Orders — Percaal</title>
    <meta name="description" content="Every Percaal order you've placed, with its status and total." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="account-orders" data-path="/account/orders" class="antialiased bg-white is-loading">
    <script>
      /* First visit only: the loader curtain (styles.css "LOADER + ARRIVAL").
         It is added here, before anything paints, instead of being written
         into the page, so every visitor and every crawler gets the same
         content. Crawlers, automated browsers and visitors who prefer
         reduced motion never see it; nor does anyone on a later visit. */
      (function () {
        if (navigator.webdriver || /bot|crawl|spider|slurp|preview|inspectiontool|facebookexternalhit/i.test(navigator.userAgent)) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        try {
          if (localStorage.getItem("percaal-visited")) return;
          localStorage.setItem("percaal-visited", "1");
        } catch (e) {
          return;
        }
        document.body.classList.add("has-loader");
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<div class="loader" data-loader aria-hidden="true"><div class="loader__inner">' +
            '<img class="loader__logo" src="images/percaal-landscape-logo.svg" alt="" width="168" height="38" />' +
            '<span class="loader__line"></span></div></div>'
        );
      })();
    </script>
    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ============ MY ORDERS (Figma 159:7484) ============
           The same table as the overview's "Latest Orders", minus the
           card title and rule: here the table is the page, so it opens
           straight on the column headers. -->
      <section class="account">
        <div class="account__inner">
          <div id="account-menu" data-active="orders"></div>

          <div class="account__main">
            <div class="acct-head">
              <nav class="acct-crumb" aria-label="Breadcrumb">
                <a href="index.html">Home</a>
                <span class="ico" data-ico="arrow-right-01-sharp" aria-hidden="true"></span>
                <span class="acct-crumb__here" aria-current="page">My Orders</span>
              </nav>
              <h1 class="acct-title">My Orders</h1>
            </div>

            <div class="acct-card">
              <div class="otable">
                <div class="otable__row otable__head">
                  <span>Order Number</span>
                  <span>Date</span>
                  <span>Status</span>
                  <span>Total</span>
                  <span></span>
                </div>
                <div class="otable" data-orders='[
                  {"id":"#30941","date":"March 28, 2023","status":"preparing","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"way","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"},
                  {"id":"#30941","date":"March 28, 2023","status":"delivered","total":"EGP 25,490.00"}
                ]'></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        var ic = window.icon || function () { return ''; };
        document.querySelectorAll('[data-ico]').forEach(function (el) {
          el.innerHTML = ic(el.getAttribute('data-ico'));
        });
      })();
    </script>
  </body>
</html>
