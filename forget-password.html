<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password — Percaal</title>
    <meta
      name="description"
      content="Reset your Percaal account password. Enter your email address and we'll send you a reset link."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="forgot-password" data-path="/forgot-password" class="antialiased bg-white is-loading">
    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ============ FORGOT PASSWORD (Figma 173:6334 → 173:6571) ============
           Two states of one page. Asking for the address is a 464px card;
           confirming it was sent is a narrower 479px one with the "Didn't
           receive the email?" line sitting on the page below the card
           rather than inside it, which is where the design puts it. -->
      <section class="auth">
        <!-- Step 1 — the address -->
        <div class="authcard" data-fp-step="email">
          <h1 class="authcard__title authcard__title--center">Forgot Password</h1>

          <form class="authcard__stack" data-fp-form novalidate>
            <div class="field field--small">
              <label class="field__label" for="fp-email">Enter Email Address</label>
              <input class="field__input" type="email" id="fp-email" name="email" autocomplete="email" required />
            </div>
            <button type="submit" class="cta cta--brown cta--sentence w-full">Reset Password</button>
          </form>
        </div>

        <!-- Step 2 — sent -->
        <div class="w-full max-w-[479px]" data-fp-step="sent" hidden>
          <div class="authcard authcard--note">
            <h2 class="authcard__title authcard__title--center">Forgot Password</h2>
            <p class="authcard__blurb authcard__blurb--center">
              Check your inbox with a link to reset your password
            </p>
            <p class="authcard__foot">
              <span data-fp-target></span>
              <a href="#" class="auth-link ms-2" data-fp-change>Change</a>
            </p>
          </div>
          <p class="authcard__foot authcard__foot--start mt-4">
            Didn't receive the email? <a href="#" class="auth-link" data-fp-resend>Resend</a>
          </p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        /* Inline every icon declared with data-ico */
        var ic = window.icon || function () { return ''; };
        document.querySelectorAll('[data-ico]').forEach(function (el) {
          el.innerHTML = ic(el.getAttribute('data-ico'));
        });

        /* Static storefront: nothing is really sent. Submitting swaps the
           card for the confirmation, and Change swaps back with the
           address still in the field. */
        var form = document.querySelector('[data-fp-form]');
        var stepEmail = document.querySelector('[data-fp-step="email"]');
        var stepSent = document.querySelector('[data-fp-step="sent"]');
        var target = document.querySelector('[data-fp-target]');
        var email = document.getElementById('fp-email');
        if (!form || !stepEmail || !stepSent) return;

        function show(sent) {
          stepEmail.hidden = sent;
          stepSent.hidden = !sent;
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!form.reportValidity()) return;
          if (target) target.textContent = email.value;
          show(true);
        });

        var change = document.querySelector('[data-fp-change]');
        if (change) {
          change.addEventListener('click', function (e) {
            e.preventDefault();
            show(false);
            email.focus();
          });
        }

        var resend = document.querySelector('[data-fp-resend]');
        if (resend) {
          resend.addEventListener('click', function (e) {
            e.preventDefault();
            resend.textContent = 'Sent';
            setTimeout(function () { resend.textContent = 'Resend'; }, 3000);
          });
        }
      })();
    </script>
  </body>
</html>
