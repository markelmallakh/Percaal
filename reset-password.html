<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password — Percaal</title>
    <meta name="description" content="Choose a new password for your Percaal account." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="reset-password" data-path="/reset-password" class="antialiased bg-white is-loading">
    <!-- Loader curtain. First child of <body> on every page so it paints
         with the first frame; initLoader() in scripts.js lifts it once fonts
         and the fold are ready. See styles.css "LOADER + ARRIVAL". -->
    <div class="loader" data-loader aria-hidden="true">
      <div class="loader__inner">
        <img class="loader__logo" src="images/percaal-landscape-logo.svg" alt="" width="168" height="38" />
        <span class="loader__line"></span>
      </div>
    </div>

    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ============ RESET PASSWORD (Figma 173:6832) ============
           The narrowest of the auth cards: 411px, 24px padding, 16px
           stack. Same password pair and live checklist as Create
           Account, driven by initPasswordFields() in scripts.js. -->
      <section class="auth">
        <div class="authcard authcard--sm">
          <h1 class="authcard__title authcard__title--center">Reset Password</h1>

          <form class="authcard__stack" data-reset-form novalidate>
            <div class="authcard__fields">
            <div class="field field--small">
              <label class="field__label" for="rp-password">Enter Password</label>
              <div class="field__pw">
                <input class="field__input" type="password" id="rp-password" name="password" autocomplete="new-password" required />
                <button type="button" class="field__eye" data-pw-toggle aria-label="Show password" aria-pressed="false">
                  <span class="ico" data-ico="eye"></span>
                </button>
              </div>
            </div>

            <div class="field field--small">
              <label class="field__label" for="rp-confirm">Confirm Password</label>
              <div class="field__pw">
                <input class="field__input" type="password" id="rp-confirm" name="confirm-password" autocomplete="new-password" required />
                <button type="button" class="field__eye" data-pw-toggle aria-label="Show password" aria-pressed="false">
                  <span class="ico" data-ico="eye"></span>
                </button>
              </div>
            </div>

            <ul class="pwrules" data-pw-rules data-pw-for="#rp-password" data-pw-confirm="#rp-confirm">
              <li class="pwrule" data-pw-rule="special">
                <span class="ico" data-ico="checkmark-circle-04"></span>
                <span>Password must contains special characters @&amp;$#*!</span>
              </li>
              <li class="pwrule" data-pw-rule="uppercase">
                <span class="ico" data-ico="checkmark-circle-04"></span>
                <span>Password must contains uppercase letters</span>
              </li>
              <li class="pwrule" data-pw-rule="match">
                <span class="ico" data-ico="checkmark-circle-04"></span>
                <span>Password must match</span>
              </li>
            </ul>
            </div>

            <button type="submit" class="cta cta--brown cta--sentence w-full">Reset Password</button>
          </form>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        /* Inline every icon declared with data-ico */
        var ic = window.icon || function () { return ''; };
        document.querySelectorAll('[data-ico]').forEach(function (el) {
          el.innerHTML = ic(el.getAttribute('data-ico'));
        });

        /* Static storefront: a valid-looking reset lands on login. */
        var form = document.querySelector('[data-reset-form]');
        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!form.reportValidity()) return;
            window.location.href = 'login.html';
          });
        }
      })();
    </script>
  </body>
</html>
