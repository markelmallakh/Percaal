<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Percaal</title>
    <meta
      name="description"
      content="Sign in to your Percaal account to track orders, save favourites and check out faster."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="login" data-path="/login" class="antialiased bg-white is-loading">
    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ============ LOGIN (Figma 154:4506) ============
           Two cards side by side on the gray-05 page: the offwhite
           "Create Account" pitch on the left, the white login form on
           the right. Both are 400px of content in 32px of padding, and
           .authcard--muted pushes its CTA to the bottom so the two
           buttons land on the same line. -->
      <section class="auth">
        <div class="auth__grid">
          <div class="authcard authcard--muted">
            <div class="authcard__head">
              <h2 class="authcard__title">Create Account</h2>
              <p class="authcard__blurb">
                Create your account today and enjoy faster checkouts, easy
                access to your order history, and exclusive offers tailored
                just for you.
              </p>
            </div>
            <a href="register.html" class="cta cta--border-black cta--sentence w-full">Create Account</a>
          </div>

          <div class="authcard">
            <h1 class="authcard__title">Login</h1>

            <form class="authcard__stack" data-login-form novalidate>
              <div class="authcard__fields">
              <div class="field field--small">
                <label class="field__label" for="login-email">Enter Email Address</label>
                <input
                  class="field__input"
                  type="email"
                  id="login-email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="field field--small">
                <label class="field__label" for="login-password">Enter Password</label>
                <div class="field__pw">
                  <input
                    class="field__input"
                    type="password"
                    id="login-password"
                    name="password"
                    autocomplete="current-password"
                    required
                  />
                  <button type="button" class="field__eye" data-pw-toggle aria-label="Show password" aria-pressed="false">
                    <span class="ico" data-ico="eye"></span>
                  </button>
                </div>
              </div>

              <a href="forget-password.html" class="auth-link self-start">Forgot Password?</a>
              </div>

              <button type="submit" class="cta cta--brown cta--sentence w-full">Login</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        /* Inline every icon declared with data-ico */
        var ic = window.icon || function () { return ''; };
        document.querySelectorAll('[data-ico]').forEach(function (el) {
          el.innerHTML = ic(el.getAttribute('data-ico'));
        });

        /* Static storefront: there is no auth backend, so a valid-looking
           submission just lands on the account page. Browser validation
           still runs so the required/type rules are the ones enforced. */
        var form = document.querySelector('[data-login-form]');
        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!form.reportValidity()) return;
            window.location.href = 'my-account.html';
          });
        }
      })();
    </script>
  </body>
</html>
