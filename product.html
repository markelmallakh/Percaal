<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product — Percaal</title>
    <meta name="description" content="Percale bed linen woven from long-staple Egyptian cotton. Choose your weave, size and colourway." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="icons.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="product" data-path="/shop" class="antialiased bg-white is-loading">
    <script>
      /* First visit only: the loader curtain (styles.css "LOADER + ARRIVAL").
         It is added here, before anything paints, instead of being written
         into the page, so every visitor and every crawler gets the same
         content. Crawlers, automated browsers and visitors who prefer
         reduced motion never see it; nor does anyone on a later visit. */
      (function () {
        if (navigator.webdriver || /bot|crawl|spider|slurp|preview|inspectiontool|facebookexternalhit/i.test(navigator.userAgent)) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        try {
          if (localStorage.getItem("percaal-visited")) return;
          localStorage.setItem("percaal-visited", "1");
        } catch (e) {
          return;
        }
        document.body.classList.add("has-loader");
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<div class="loader" data-loader aria-hidden="true"><div class="loader__inner">' +
            '<img class="loader__logo" src="images/percaal-landscape-logo.svg" alt="" width="168" height="38" />' +
            '<span class="loader__line"></span></div></div>'
        );
      })();
    </script>
    <div id="site-header"></div>

    <main class="overflow-x-clip">
      <!-- ================= GALLERY + BUY BOX (Figma 60:5382) =================
           Left: the gallery, one large photo with thumbnails. Right: 446px buy
           box with breadcrumb, name/price, rating, size chips, colour
           circles, ADD TO BAG, delivery line, description, two collapsible
           sections (Product Specifications, Care) and an always-open FAQs
           list. -->
      <section class="pdp">
        <div class="pdp__inner">

          <!-- Gallery: one large photo with thumbnails beside it and arrows
               over it on desktop, a full-bleed swipe carousel on phones and
               tablets. Built by render() below; see "Gallery" in styles.css. -->
          <div class="pdp__gallery" data-gallery></div>

          <!-- Buy box -->
          <div class="pdp__buy">
            <nav aria-label="Breadcrumb" class="pdp__crumb">
              <a href="index.html">HOME</a>
              <span class="ico ico-16" data-ico="arrow-right-01-sharp"></span>
              <a href="shop.html" data-crumb-cat>Bedding</a>
              <span class="ico ico-16" data-ico="arrow-right-01-sharp"></span>
              <span class="pdp__crumb-here" data-crumb-name>Product</span>
            </nav>

            <div class="pdp__head">
              <div class="pdp__head-title">
                <h1 class="pdp__name" data-name>Product</h1>
                <p class="pdp__price" data-price>EGP —</p>
              </div>
              <button type="button" class="pdp__fav" aria-label="Save to wishlist" aria-pressed="false">
                <span class="ico ico-24" data-ico="favourite"></span>
              </button>
            </div>

            <div class="pdp__rating" aria-label="Rated 4 out of 5 (12 reviews)">
              <span class="pdp__stars" aria-hidden="true">
                <span class="ico ico-16" data-ico="star"></span>
                <span class="ico ico-16" data-ico="star"></span>
                <span class="ico ico-16" data-ico="star"></span>
                <span class="ico ico-16" data-ico="star"></span>
                <span class="ico ico-16 is-muted" data-ico="star"></span>
              </span>
              <span class="pdp__rating-count">12</span>
            </div>

            <!-- Size chips: bordered rectangles, active state = ink border -->
            <div class="pdp__group" data-size-block>
              <div class="pdp__group-head">
                <span class="pdp__group-label">Size</span>
              </div>
              <div class="pdp__chips" data-size-opts></div>
            </div>

            <!-- Colour: circle swatches with label underneath -->
            <div class="pdp__group" data-colour-block>
              <div class="pdp__group-head">
                <span class="pdp__group-label">Color</span>
                <span class="pdp__group-value" data-colour-name></span>
              </div>
              <div class="pdp__swatches" data-colour-opts></div>
            </div>

            <!-- Fabric picker + description block. Fabric is a choice like
                 Size and Colour, so it sits with them above ADD TO BAG, as
                 one row of equal chips. The short note below repurposes the
                 Figma "Introducing" block for whichever fabric is selected. -->
            <div class="pdp__group" data-fabric-block>
              <div class="pdp__group-head">
                <span class="pdp__group-label">Fabric</span>
                <span class="pdp__group-value" data-fabric-name></span>
              </div>
              <div class="pdp__chips pdp__chips--row" data-fabric-opts></div>
              <p class="pdp__fabric-desc" data-fabric-desc></p>
            </div>

            <!-- Two CTAs. ADD TO BAG (secondary, outline) puts the chosen
                 variant in the bag and opens the summary cart; BUY NOW
                 (primary) skips the bag and goes straight to checkout with
                 just this item. Then the delivery line. -->
            <div class="pdp__buy-block">
              <div class="pdp__qty-row">
                <div class="pdp__stepper" data-stepper>
                  <button type="button" data-step="-1" class="pdp__stepper-btn" aria-label="Decrease quantity"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                  <span data-qty class="pdp__stepper-qty">1</span>
                  <button type="button" data-step="1" class="pdp__stepper-btn" aria-label="Increase quantity"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                </div>
                <button type="button" class="pdp__addtobag" data-add-to-bag>ADD TO BAG</button>
              </div>
              <button type="button" class="pdp__buynow" data-buy-now>BUY NOW</button>
              <p class="pdp__delivery">
                <span class="ico ico-24" data-ico="scooter-02"></span>
                <span>DELIVER WITHIN 3 DAYS IN CAIRO AND GIZA</span>
              </p>
            </div>

            <!-- Collapsible: Product Specifications, Care. One open at a time. -->
            <div class="pdp__acc" data-accordion>
              <section class="pdp__acc-item is-open">
                <button type="button" class="pdp__acc-legend" aria-expanded="true">
                  <span>Product Specifications</span>
                  <span class="sfd__legend-sign" aria-hidden="true"></span>
                </button>
                <div class="pdp__acc-body"><div class="speclist" data-spec></div></div>
              </section>
              <section class="pdp__acc-item">
                <button type="button" class="pdp__acc-legend" aria-expanded="false">
                  <span>Care</span>
                  <span class="sfd__legend-sign" aria-hidden="true"></span>
                </button>
                <div class="pdp__acc-body"><p class="pdp__acc-copy" data-care></p></div>
              </section>
            </div>

            <!-- Questions about this product, its delivery, care and making.
                 Always open, so the questions are one tap away; each answer
                 opens on its own. Built per product in the controller below,
                 which also publishes them as FAQPage structured data. -->
            <section class="pdp-faqs" aria-labelledby="pdp-faqs-title">
              <h2 class="pdp-faqs__title" id="pdp-faqs-title">FAQs</h2>
              <div class="faq__list pdp-faq" data-pdp-faq data-faq></div>
            </section>
          </div>
        </div>
      </section>

      <!-- Related Products (Figma 2026:13966) -->
      <section class="pdp-related">
        <div class="pdp-related__inner">
          <h2 class="pdp-related__title">Related Products</h2>
          <div class="egrid egrid--4" data-related></div>
        </div>
      </section>
    </main>

    <!-- Demo switch: show this page with an empty or a filled bag. With
         something already in the bag, BUY NOW steps aside and ADD TO BAG
         leads (styles.css, "has-cart"). It empties or refills the real
         demo bag, so the badge and the drawer agree, and it follows the
         bag if an item is added (scripts.js, setDemoCart). -->
    <div class="demo-switch" role="group" aria-label="Cart state (demo)">
      <button type="button" data-demo-cart="empty" aria-pressed="false">Empty cart</button>
      <button type="button" data-demo-cart="filled" aria-pressed="true">Filled cart</button>
    </div>

    <div id="site-footer"></div>

    <script>
      /* ---------------------------------------------------------------
         Product page controller.

         Three variation axes — fabric, colour, size — and the price
         depends on the fabric. Everything re-renders from one `state`
         object so the price, the picture and the SKU line can never
         disagree with the buttons that are lit.
         --------------------------------------------------------------- */
      document.addEventListener("DOMContentLoaded", function () {
        var P = window.percaalProducts || [];
        var F = window.percaalFabrics || {};
        var CW = (window.percaalColourways || {}).map || {};
        var money = window.percaalMoney || function (n) { return "EGP " + n; };
        var art = window.percaalArt;
        if (!P.length) return;

        var slug = new URLSearchParams(location.search).get("p") || P[0].slug;
        var p = P.filter(function (x) { return x.slug === slug; })[0] || P[0];

        var state = { fabric: p.fabrics[p.fabrics.length - 1], colour: p.colours[0], size: p.sizes[0] };

        var CARE = {
          cotton: "Machine wash at 40°, tumble dry low, and fold while still just warm — percale creases least when it is put away warm. No bleach, no fabric softener: softener coats the fibre and is what makes cotton stop breathing.",
          "tc-400": "Machine wash at 40°, tumble dry low. Skip the fabric softener — it coats the fibre and undoes the breathability you paid for. Iron on the reverse while barely damp if you like a hotel finish.",
          "tc-200": "Machine wash at 40°, tumble dry low. Skip the fabric softener. Comes out of the dryer ready to use; iron only if you want the crease.",
          blend: "Machine wash at 40°, tumble dry low, remove promptly. Designed not to need ironing.",
          microfiber: "Machine wash at 30° on a gentle cycle. Tumble dry low. Do not iron.",
          "memory-foam": "Spot clean only. Air the pillow monthly; never machine wash memory foam.",
          pollydown: "Machine washable at 30°. Tumble dry low with dryer balls to keep the fill even.",
        };
        var HANDMADE_CARE =
          "Hand wash only, cold, and dry flat in the shade. Made by hand from traditionally sourced Upper Egypt cotton — recommended for pet-free homes.";

        /* ---- Product FAQs ------------------------------------------
           Questions a shopper (and an answer engine) asks about this exact
           product: what it is made of, which fabric and size to pick,
           delivery, returns, washing, where it is made. Answers are built
           from the catalogue and the site's published policies (the
           announcement bar, the delivery line above and the FAQ page), so
           they can't drift from what the rest of the site says. Rebuilt
           on every render, because the fabric changes the answers. */
        function faqs() {
          var f = F[state.fabric] || {};
          var name = p.name;
          var list = [];

          /* Wooden and furniture pieces carry a placeholder "cotton" fabric
             in the catalogue, so the textile questions (material, washing,
             colour of the cloth) are only asked of textiles; answering them
             for a wooden tray would publish something untrue. */
          var textile = p.sub !== "decor" && p.sub !== "furniture";

          if (textile) {
            // "400 TC · 100% Egyptian cotton" → "100% Egyptian cotton";
            // lower-cased mid-sentence unless it starts with a figure.
            var comp = (f.short || "").replace(/^\d+ TC · /, "");
            comp = /^\d/.test(comp) ? comp : comp.charAt(0).toLowerCase() + comp.slice(1);
            list.push([
              "What is the " + name + " made of?",
              (p.fabrics.length > 1 ? "In the " + f.name + " you have selected, it is " : "It is ") +
                comp + ". " + (f.long || ""),
            ]);
          }

          if (p.fabrics.length > 1) {
            var TIP = {
              "tc-400": "400 Thread Count for the smoothest, densest feel",
              "tc-200": "200 Thread Count for a crisp, cool everyday weave",
              blend: "the Easy-Care Blend if you would rather skip the iron",
              "memory-foam": "Memory Foam for support that contours to you",
              microfiber: "Microfiber for a softer, lighter pillow",
            };
            list.push([
              "Which fabric should I choose?",
              "It comes in " + p.fabrics.length + " fabrics: " +
                p.fabrics.map(function (k) {
                  return ((F[k] || {}).name || k) + " at " + money(p.price[k]);
                }).join(", ") +
                ". Choose " +
                p.fabrics.map(function (k) { return TIP[k]; }).filter(Boolean).join("; or ") + ".",
            ]);
          }

          if (p.sizes.length > 1) {
            // Mattress advice only where it applies: sheets and duvet covers.
            var bed = p.sub === "bed-sheets" || p.sub === "duvet-covers";
            list.push([
              "What sizes does the " + name + " come in?",
              "It comes in " + p.sizes.join(", ") + "." +
                (bed ? " Measure your mattress before ordering; if you are between sizes, go up, because a sheet one size large still holds and one size small will pop a corner." : ""),
            ]);
          }

          list.push([
            "How long does delivery take?",
            "Within 3 working days in Cairo and Giza, and 2 to 4 working days to most other addresses in Egypt. Delivery is free on orders above 5,000 EGP, and selected international destinations are offered at checkout.",
          ]);

          list.push([
            "Can I return or exchange it?",
            "Yes. Unused, unwashed items in their original packaging can be returned or exchanged within 14 days of delivery. Start it from your account's Orders page, or in any Percaal store.",
          ]);

          if (textile) {
            list.push([
              "How do I wash and care for it?",
              p.cat === "handmade" ? HANDMADE_CARE : CARE[state.fabric] || CARE.cotton,
            ]);
          }

          list.push([
            "Where is the " + name + " made?",
            "In Egypt." +
              (/egyptian cotton/i.test(f.short || "") ? " It is made from Egyptian cotton, the long-staple fibre the country is known for, which is what gives it its softness and strength." : ""),
          ]);

          if (textile) {
            list.push([
              "Is the colour exactly as shown?",
              "Yes. Photography is shot in daylight with no colour retouching, so what you see is the cloth. Screens vary slightly, so order the Fabric Swatch Set if the exact shade matters.",
            ]);
          }

          return list;
        }

        function renderFaqs() {
          var mount = document.querySelector("[data-pdp-faq]");
          if (!mount) return;
          var items = faqs();
          var openRow = mount.querySelector(".faq__item.is-open");
          var openIndex = openRow ? Array.prototype.indexOf.call(mount.children, openRow) : -1;
          var ic = window.icon || function () { return ""; };
          mount.innerHTML = items
            .map(function (qa, i) {
              var open = i === openIndex;
              return (
                '<div class="faq__item' + (open ? " is-open" : "") + '">' +
                '<button type="button" class="faq__q" aria-expanded="' + open + '" aria-controls="pdp-faq-' + i + '">' +
                "<span>" + qa[0] + "</span>" +
                '<span class="faq__sign">' +
                '<span class="faq__plus ico ico-16">' + ic("plus-sign") + "</span>" +
                '<span class="faq__minus ico ico-16">' + ic("minus-sign") + "</span>" +
                "</span></button>" +
                '<div class="faq__a" id="pdp-faq-' + i + '"><p>' + qa[1] + "</p></div></div>"
              );
            })
            .join("");

          /* The same questions as FAQPage structured data, for search and
             answer engines. One script, replaced on each render. */
          var ld = document.getElementById("pdp-faq-ld");
          if (!ld) {
            ld = document.createElement("script");
            ld.type = "application/ld+json";
            ld.id = "pdp-faq-ld";
            document.head.appendChild(ld);
          }
          ld.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "FAQPage",
            mainEntity: items.map(function (qa) {
              return { "@type": "Question", name: qa[0], acceptedAnswer: { "@type": "Answer", text: qa[1] } };
            }),
          });
        }

        function price() {
          return (p.price && p.price[state.fabric]) || p.from;
        }

        function chip(label, attr, val, active) {
          return (
            '<button type="button" class="pdp__chip' + (active ? " is-active" : "") +
            '" data-' + attr + '="' + val + '">' + label + "</button>"
          );
        }

        function setText(sel, txt) { var el = document.querySelector(sel); if (el) el.textContent = txt; }

        function render() {
          var f = F[state.fabric] || {};
          var c = CW[state.colour] || { name: state.colour };

          document.title = p.name + " — Percaal";
          setText("[data-name]", p.name);
          setText("[data-crumb-name]", p.name);
          var catLink = document.querySelector("[data-crumb-cat]");
          if (catLink) {
            catLink.textContent = p.cat.replace(/-/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
            catLink.href = "shop-category.html?c=" + p.cat;
          }

          setText("[data-price]", money(price()));

          var fBlock = document.querySelector("[data-fabric-block]");
          if (fBlock) fBlock.hidden = p.fabrics.length < 2;
          setText("[data-fabric-name]", f.name || "");
          setText("[data-fabric-desc]", f.long || "");
          var fOpts = document.querySelector("[data-fabric-opts]");
          if (fOpts) fOpts.innerHTML = p.fabrics
            .map(function (k) { return chip((F[k] || {}).name || k, "fabric", k, k === state.fabric); })
            .join("");

          var cBlock = document.querySelector("[data-colour-block]");
          if (cBlock) cBlock.hidden = p.colours.length < 2;
          setText("[data-colour-name]", c.name || "");
          var cOpts = document.querySelector("[data-colour-opts]");
          if (cOpts) cOpts.innerHTML = p.colours
            .map(function (k) {
              var m = CW[k] || { hex: "#ccc", name: k };
              return (
                '<button type="button" class="pdp__swatch' + (k === state.colour ? " is-active" : "") +
                '" data-colour="' + k + '" title="' + m.name + '" aria-label="' + m.name + '">' +
                '<span class="pdp__swatch-dot" style="--sw:' + m.hex + '"></span>' +
                '<span class="pdp__swatch-label">' + m.name + '</span>' +
                '</button>'
              );
            })
            .join("");

          var sBlock = document.querySelector("[data-size-block]");
          if (sBlock) sBlock.hidden = p.sizes.length < 2;
          var sOpts = document.querySelector("[data-size-opts]");
          if (sOpts) sOpts.innerHTML = p.sizes
            .map(function (s) { return chip(s, "size", s, s === state.size); })
            .join("");

          /* Gallery: one photograph per colourway, the selected one first.
             Thumbnails and arrows (desktop) and swipes (phones) all move
             one scroll-snap track; the controls are wired once, further
             down. Rebuilt only when the product or colourway changes, so
             picking a size never jumps back to the first photo. */
          var gallery = document.querySelector("[data-gallery]");
          var galleryKey = p.slug + "|" + state.colour;
          if (gallery && gallery.dataset.key !== galleryKey) {
            gallery.dataset.key = galleryKey;
            var gic = window.icon || function () { return ""; };
            var shots = p.colours.slice(0, 6);
            shots = [state.colour].concat(shots.filter(function (k) { return k !== state.colour; }));
            var many = shots.length > 1;
            var shotName = function (k) { return p.name + " in " + (((CW[k] || {}).name) || k); };
            gallery.classList.toggle("pdp__gallery--single", !many);
            /* Thumbnails always show on desktop, even for a single photo,
               so every product page has the same frame; the arrows and
               phone dashes only appear when there is more than one. */
            gallery.innerHTML =
              ('<div class="pdp__thumbs">' +
                  shots
                    .map(function (k, i) {
                      return (
                        '<button type="button" class="pdp__thumb' + (i === 0 ? " is-active" : "") +
                        '" data-gal-go="' + i + '" aria-label="Show image ' + (i + 1) + " of " + shots.length + '"' +
                        (i === 0 ? ' aria-current="true"' : "") + ">" +
                        '<img src="' + art(p, k) + '" alt="" loading="lazy" /></button>'
                      );
                    })
                    .join("") +
                  "</div>") +
              '<div class="pdp__stage">' +
              '<div class="pdp__track" data-gal-track tabindex="0" aria-label="Product images">' +
              shots
                .map(function (k, i) {
                  /* The first photo is the page's largest element: load it
                     straight away, ahead of everything else. */
                  return (
                    '<img class="pdp__slide" src="' + art(p, k) + '" alt="' + shotName(k) + '"' +
                    (i === 0 ? ' fetchpriority="high"' : ' loading="lazy"') + " />"
                  );
                })
                .join("") +
              "</div>" +
              (many
                ? '<button type="button" class="pdp__arrow pdp__arrow--prev" data-gal-step="-1" aria-label="Previous image">' +
                  gic("arrow-left-01-sharp") + "</button>" +
                  '<button type="button" class="pdp__arrow pdp__arrow--next" data-gal-step="1" aria-label="Next image">' +
                  gic("arrow-right-01-sharp") + "</button>"
                : "") +
              "</div>" +
              (many
                ? '<div class="pdp__dots" aria-hidden="true">' +
                  shots.map(function (k, i) { return '<span class="pdp__dot' + (i === 0 ? " is-active" : "") + '"></span>'; }).join("") +
                  "</div>"
                : "");
          }

          var care = p.cat === "handmade" ? HANDMADE_CARE : CARE[state.fabric] || CARE.cotton;
          setText("[data-care]", care);
          renderFaqs();

          var spec = document.querySelector("[data-spec]");
          if (spec) spec.innerHTML = [
            ["Fabric", f.short || ""],
            ["Colour", c.name || ""],
            ["Size", state.size],
            ["Category", p.cat.replace(/-/g, " ")],
            ["Made in", "Egypt"],
          ]
            .map(function (r) { return "<div><span>" + r[0] + "</span><span>" + r[1] + "</span></div>"; })
            .join("");
        }

        document.addEventListener("click", function (e) {
          var el = e.target.closest("[data-fabric],[data-colour],[data-size]");
          if (!el || !el.closest("main")) return;
          e.preventDefault();
          if (el.hasAttribute("data-fabric")) state.fabric = el.getAttribute("data-fabric");
          else if (el.hasAttribute("data-colour")) state.colour = el.getAttribute("data-colour");
          else state.size = el.getAttribute("data-size");
          render();
        });

        /* Demo switch: mirrors the bag (body.has-cart), and empties or
           refills it on click. */
        (function () {
          var btns = document.querySelectorAll("[data-demo-cart]");
          if (!btns.length) return;
          function mark() {
            var state = document.body.classList.contains("has-cart") ? "filled" : "empty";
            btns.forEach(function (b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-demo-cart") === state ? "true" : "false");
            });
          }
          btns.forEach(function (b) {
            b.addEventListener("click", function () {
              if (window.kSetDemoCart) window.kSetDemoCart(b.getAttribute("data-demo-cart"));
            });
          });
          document.addEventListener("percaal:cart", mark);
          mark();
        })();

        /* Gallery controls. Delegated, because render() rebuilds the
           gallery; the track's scroll is caught in the capture phase for
           the same reason (scroll events do not bubble). Arrows wrap from
           the last photo to the first. */
        (function () {
          var gallery = document.querySelector("[data-gallery]");
          if (!gallery) return;
          var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var track = function () { return gallery.querySelector("[data-gal-track]"); };
          /* Slides are narrower than the track on phones (the next one
             peeks in), so positions are measured, not divided out. The
             leading edge is the track's start padding, in either text
             direction. */
          function edge(t) {
            var r = t.getBoundingClientRect();
            var cs = getComputedStyle(t);
            return cs.direction === "rtl"
              ? { rtl: true, at: r.right - parseFloat(cs.paddingRight) }
              : { rtl: false, at: r.left + parseFloat(cs.paddingLeft) };
          }
          function current() {
            var t = track();
            if (!t) return 0;
            var slides = t.querySelectorAll(".pdp__slide");
            /* At the far end the last slide cannot reach the leading
               edge, so the end of the scroll counts as the last slide. */
            if (Math.abs(t.scrollLeft) >= t.scrollWidth - t.clientWidth - 2) return slides.length - 1;
            var e = edge(t), best = 0, gap = Infinity;
            slides.forEach(function (sl, i) {
              var r = sl.getBoundingClientRect();
              var d = Math.abs((e.rtl ? r.right : r.left) - e.at);
              if (d < gap) { gap = d; best = i; }
            });
            return best;
          }
          function go(i) {
            var t = track();
            var slides = t ? t.querySelectorAll(".pdp__slide") : [];
            if (!slides.length) return;
            i = ((i % slides.length) + slides.length) % slides.length;
            var e = edge(t), r = slides[i].getBoundingClientRect();
            /* An absolute scrollTo, not scrollBy: a relative scroll is
               treated like a key press and stops at every snap point on
               the way, so wrapping from the last photo would halt at the
               one before. */
            t.scrollTo({ left: t.scrollLeft + (e.rtl ? r.right : r.left) - e.at, behavior: reduce ? "auto" : "smooth" });
          }
          function mark() {
            var i = current();
            gallery.querySelectorAll(".pdp__thumb").forEach(function (b, k) {
              b.classList.toggle("is-active", k === i);
              if (k === i) b.setAttribute("aria-current", "true");
              else b.removeAttribute("aria-current");
            });
            gallery.querySelectorAll(".pdp__dot").forEach(function (d, k) {
              d.classList.toggle("is-active", k === i);
            });
          }
          gallery.addEventListener("click", function (e) {
            var to = e.target.closest("[data-gal-go]");
            if (to) return go(parseInt(to.getAttribute("data-gal-go"), 10));
            var step = e.target.closest("[data-gal-step]");
            if (step) go(current() + parseInt(step.getAttribute("data-gal-step"), 10));
          });
          var queued = 0;
          gallery.addEventListener(
            "scroll",
            function () {
              if (!queued) queued = requestAnimationFrame(function () { queued = 0; mark(); });
            },
            true
          );
        })();

        function qty() {
          return parseInt((document.querySelector(".pdp__stepper [data-qty]") || {}).textContent || "1", 10) || 1;
        }

        /* ADD TO BAG: the chosen variant goes into the bag, then the
           summary cart opens so the shopper sees it land. */
        var add = document.querySelector("[data-add-to-bag]");
        if (add) {
          add.addEventListener("click", function () {
            if (window.kAddLine) {
              window.kAddLine(p.slug, { colour: state.colour, size: state.size, fabric: state.fabric, qty: qty() });
            }
            if (window.kOpenCart) window.kOpenCart();
          });
        }

        /* BUY NOW: an express checkout for just this item. The bag is left
           alone; the item and its options travel in the URL, and the
           checkout summary is built from them (initBuyNowSummary). */
        var buy = document.querySelector("[data-buy-now]");
        if (buy) {
          buy.addEventListener("click", function () {
            var q = new URLSearchParams({
              buy: p.slug, colour: state.colour, size: state.size, fabric: state.fabric, qty: String(qty()),
            });
            location.href = "checkout.html?" + q.toString();
          });
        }

        /* Inline every icon declared with data-ico — populated here so
           the breadcrumb arrows, star row, favourite heart and delivery
           scooter render after this page's own DOM is in place. */
        var ic = window.icon || function () { return ""; };
        document.querySelectorAll("[data-ico]").forEach(function (el) {
          el.innerHTML = ic(el.getAttribute("data-ico"));
        });

        /* Accordion sections in the buy box (Product Specifications /
           Care). One open at a time: opening one closes the other, and
           tapping the open one closes it. */
        document.addEventListener("click", function (e) {
          var lg = e.target.closest(".pdp__acc-legend");
          if (!lg) return;
          var item = lg.closest(".pdp__acc-item");
          var opening = !item.classList.contains("is-open");
          item.closest(".pdp__acc").querySelectorAll(".pdp__acc-item").forEach(function (row) {
            var on = row === item && opening;
            row.classList.toggle("is-open", on);
            var btn = row.querySelector(".pdp__acc-legend");
            if (btn) btn.setAttribute("aria-expanded", on ? "true" : "false");
          });
        });

        /* Related: other products in the same category, then anything else,
           so a short category still fills the row. */
        var related = P.filter(function (x) { return x.slug !== p.slug && x.cat === p.cat; })
          .concat(P.filter(function (x) { return x.slug !== p.slug && x.cat !== p.cat; }))
          .slice(0, 4);
        document.querySelector("[data-related]").innerHTML = related
          .map(function (x) { return window.percaalCard(x); })
          .join("");

        render();
        if (window.kInit) window.kInit(document);
      });
    </script>
  </body>
</html>
